<style>
/* One fixed look by design (blueprint navy + paper slides), the kickoff deck's, painted explicitly so it
   reads the same on any host theme. No web fonts: the deck opens offline, from the pack, with system fonts. */
:root{
  color-scheme:light;
  --ink:#13263A;        /* dark slides, text on light */
  --ink-2:#1C3654;      /* dark gradient end */
  --paper:#F4F6F5;      /* light slides */
  --card:#FFFFFF;
  --line:#D3DCDF;
  --muted:#56677A;
  --accent:#F08A24;     /* safety orange: fills, and text on dark */
  --accent-text:#A9520A;/* orange text on light */
  --blue:#8FC1E3;       /* blueprint line on dark */
  --on-dark:#FFFFFF;
  --on-dark-muted:rgba(255,255,255,.68);
  --display:'Archivo','Avenir Next Condensed','Arial Narrow',Arial,sans-serif;
  --sans:'Source Sans 3','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --u:1cqw;             /* type unit: tracks deck width; fixed px on narrow screens */
}
html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--on-dark);font-family:var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
body{overflow:hidden}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Stage: 16:9 letterboxed */
.stage{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink)}
.deck{width:min(100vw,177.78vh);height:min(56.25vw,100vh);position:relative;container-type:inline-size;overflow:hidden;background:var(--ink)}
.slide{position:absolute;inset:0;padding:5.5cqh 6.5cqw 7cqh;display:none;flex-direction:column;gap:calc(var(--u)*1.6)}
.slide.is-active{display:flex}
.slide--dark{background:linear-gradient(140deg,var(--ink),var(--ink-2));color:var(--on-dark)}
.slide--light{background:var(--paper);color:var(--ink)}

/* Type: sized to read on a shared screen */
.eyebrow{font-family:var(--mono);font-size:calc(var(--u)*1.05);letter-spacing:.12em;text-transform:uppercase;margin:0}
.slide--dark .eyebrow{color:var(--accent)}
.slide--light .eyebrow{color:var(--accent-text)}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:calc(var(--u)*5)}
h2{font-size:calc(var(--u)*3)}
.hl{color:var(--accent)}
.sub{font-family:var(--sans);font-weight:400;font-size:calc(var(--u)*1.75);line-height:1.35;margin:0;max-width:62ch;text-wrap:balance}
p,li{font-size:calc(var(--u)*1.5);line-height:1.45;font-weight:400;margin:0}
.slide--dark p,.slide--dark li{color:var(--on-dark)}
strong{font-weight:700}
ul,ol{margin:0;padding-left:calc(var(--u)*1.6);display:flex;flex-direction:column;gap:calc(var(--u)*.6)}
.small{font-size:calc(var(--u)*1.2);opacity:.85}
code,kbd{font-family:var(--mono);font-size:.9em}
.slide--dark code,.slide--dark kbd{color:var(--blue)}
kbd{font-weight:500}

/* Layout */
.head{display:flex;flex-direction:column;gap:calc(var(--u)*.8)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.3)}
.cols{display:grid;gap:calc(var(--u)*1.6);align-items:start}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:1fr 1fr 1fr}
.cols-32{grid-template-columns:3fr 2fr}
.cols-23{grid-template-columns:2fr 3fr}
.stretch{align-items:stretch}
.col{display:flex;flex-direction:column;gap:calc(var(--u)*1.2)}

/* Cards */
.card{border-radius:10px;padding:calc(var(--u)*1.2) calc(var(--u)*1.4);display:flex;flex-direction:column;gap:calc(var(--u)*.5)}
.slide--light .card{background:var(--card);border:1px solid var(--line)}
.slide--dark .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.card p,.card li{font-size:calc(var(--u)*1.4)}
.k{font-family:var(--mono);font-size:calc(var(--u)*1.05);letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.slide--light .k{color:var(--accent-text)}
.slide--dark .k{color:var(--accent)}
.card--accent{border-color:var(--accent)!important;border-width:2px!important}

/* Tables */
table{border-collapse:collapse;width:100%;font-size:calc(var(--u)*1.4);line-height:1.38}
th,td{text-align:left;padding:calc(var(--u)*.55) calc(var(--u)*.6);vertical-align:top}
thead th{font-family:var(--mono);font-size:calc(var(--u)*.85);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.slide--light td,.slide--light th{border-bottom:1px solid var(--line);color:var(--ink)}
.slide--light thead th{color:var(--muted)}
.slide--dark td,.slide--dark th{border-bottom:1px solid rgba(255,255,255,.14);color:var(--on-dark)}
tbody th{font-weight:700}
td code{font-size:calc(var(--u)*1)}
table.day{font-size:calc(var(--u)*1.2)}
table.day td:first-child{font-family:var(--mono);font-size:.88em;white-space:nowrap}
table.perm{font-size:calc(var(--u)*1.2)}
table.perm td:nth-child(2){font-weight:700;width:22%}
table.keys td:first-child{font-weight:700;width:24%}

/* Slide parts */
ol.rules{gap:calc(var(--u)*1)}
ol.rules li{font-size:calc(var(--u)*1.6);line-height:1.45}
ul.words{columns:2;column-gap:calc(var(--u)*2.4);display:block}
ul.words li{break-inside:avoid;margin-bottom:calc(var(--u)*.7);font-size:calc(var(--u)*1.4)}
.slide--dark p.hl{color:var(--accent)}
.card p.logline{font-size:calc(var(--u)*1.05);overflow-wrap:anywhere}
.bigline{font-family:var(--display);font-weight:800;font-size:calc(var(--u)*2.2);line-height:1.15}
.say{font-family:var(--display);font-weight:700;font-size:calc(var(--u)*1.7);line-height:1.25}
.slide--light .say{color:var(--accent-text)}
/* A link or date the lab author fills in before the session */
.todo{font-family:var(--mono);font-size:.82em;padding:0 .35em;border:2px dashed var(--accent);border-radius:4px;white-space:nowrap}
.slide--light .todo{color:var(--accent-text)}
.slide--dark .todo{color:var(--accent)}

/* Chrome */
.chrome{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*2.6);display:flex;align-items:center;justify-content:space-between;padding:0 6.5cqw;font-family:var(--mono);font-size:calc(var(--u)*.82);letter-spacing:.08em;text-transform:uppercase;pointer-events:none;color:var(--on-dark-muted)}
.chrome.on-light{color:var(--muted)}
.progress{position:absolute;left:0;bottom:0;height:calc(var(--u)*.3);background:var(--accent);width:0;transition:width .25s ease}
.notes{position:absolute;left:0;right:0;bottom:0;max-height:40%;overflow:auto;background:rgba(19,38,58,.97);color:var(--on-dark);border-top:2px solid var(--accent);padding:calc(var(--u)*1.1) 6.5cqw;font-size:calc(var(--u)*1.15);line-height:1.5;display:none}
.notes.is-open{display:block}
.notes .k{display:block;margin-bottom:calc(var(--u)*.4);color:var(--accent)}
.help{position:absolute;top:calc(var(--u)*1.1);right:calc(var(--u)*1.5);font-family:var(--mono);font-size:calc(var(--u)*.78);letter-spacing:.08em;text-transform:uppercase;color:var(--on-dark-muted)}
.help.on-light{color:var(--muted)}
aside.speaker{display:none}
.next{font-family:var(--mono);font-size:calc(var(--u)*.88);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;margin-top:auto}
.slide--dark .next{color:var(--on-dark-muted)}
.slide *:focus-visible,.notes:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (prefers-reduced-motion:reduce){.progress{transition:none}}

/* Narrow screens: slides become one scrolling page with fixed type */
@media (max-width:760px){
  :root{--u:10.5px}
  body{overflow:auto;height:auto}
  html{height:auto}
  .stage{position:static;display:block;place-items:normal}
  .deck{width:100%;height:auto;container-type:normal;overflow:visible}
  .slide{position:relative;display:flex!important;inset:auto;padding:32px 16px 36px;gap:16px}
  .cols-2,.cols-3,.cols-32,.cols-23{grid-template-columns:1fr}
  h1{font-size:34px} h2{font-size:26px}
  .sub{font-size:18px} p,li,.card p,.card li,ol.rules li,ul.words li{font-size:15px}
  ul.words{columns:1}
  .k{font-size:11px} .eyebrow{font-size:11px} .bigline{font-size:22px} .say{font-size:18px}
  table,table.day,table.perm{font-size:14px} thead th{font-size:11px}
  .todo{white-space:normal}
  .slide *{min-width:0}
  .chrome,.notes,.help,.progress{display:none!important}
}

@media print{
  @page{size:297mm 167mm;margin:0}
  html,body{overflow:visible;height:auto;background:#fff}
  .stage{position:static;display:block}
  .deck{width:297mm;height:auto;overflow:visible;container-type:inline-size;margin:0}
  .deck .slide{display:flex!important;position:relative;width:297mm;height:167mm;page-break-after:always;break-after:page}
  .chrome,.notes,.help,.progress{display:none!important}
}
</style>
</head>

<!-- 1 Welcome, and the anonymous poll · 0:00–0:05 -->
<section class="slide slide--dark" data-chrome="dark">
  <div class="head"><p class="eyebrow">Agentic Build Lab · Pre-session · 60 minutes</p></div>
  <div class="body" style="justify-content:center">
    <h1>Everyone here is new to <span class="hl">something.</span></h1>
    <p class="sub">A week before the lab day: how the day runs, the terminal, where you act, the rules and their reasons, the words, and your pre-work.</p>
    <div class="cols cols-2 stretch">
      <div class="card">
        <p class="k">Anonymous poll</p>
        <p>How comfortable are you with a terminal? With Claude Code? With git?</p>
        <p>We show the spread, never who answered.</p>
      </div>
      <div class="card">
        <p class="k">Ask anything, any time</p>
        <p>Type <code>?</code> in the chat, or use the anonymous form: <span class="todo" data-todo>TO FILL: anonymous form link</span></p>
        <p>We read questions out as "Someone asked…", never with a name.</p>
      </div>
    </div>
  </div>
  <aside class="speaker">Start the recording, with captions on. Welcome. The lab day asks a lot at once, and nobody should meet a terminal, a rule or a new word for the first time at 09:00 on the day: that's why this session exists. Each presenter names one thing in the lab they had to look up themselves. Then launch the anonymous poll: three questions, each from "never used it" to "use it every day". Show the results and read out the spread, never names: "Some of us use a terminal every day, some never have. Both are fine here." The method is new to every one of us, seniors included. After each part, pause for 30 seconds: "Anything unclear so far? Type a question mark in the chat, or use the anonymous form." Never ask for hands.</aside>
</section>

<!-- 3 How the day runs -->
<section class="slide slide--light" data-chrome="light">
  <div class="head">
    <p class="eyebrow">How the day runs</p>
    <h2>The AI types. <span class="hl">People and checks decide.</span></h2>
  </div>
  <div class="body">
    <div class="cols cols-2 stretch">
      <div class="card card--accent">
        <p class="k">The method</p>
        <p data-quote="README">Claude Code writes the code. You make the decisions, and checks decide whether work may go on.</p>
        <p data-quote="README">Modules 1 to 8 each have one <strong>catch</strong>, a moment where the process stops a mistake. Those moments are the lesson.</p>
      </div>
      <div class="card">
        <p class="k">Log it</p>
        <p data-quote="README">You write no notes. At the end of each module, a <strong>Log it</strong> prompt has Claude draft that module's catches, one line each. Reply <code>keep</code>, or say what to change:</p>
        <p class="logline"><code>&lt;module&gt; | &lt;what caught it&gt; | &lt;what it caught, and what was done&gt;</code></p>
      </div>
      <div class="card">
        <p class="k">Behind?</p>
        <p data-quote="README">The buffer, 16:20–17:00, is for catching up. Behind? Ask your instructor for a checkpoint to start the next module from.</p>
      </div>
      <div class="card">
        <p class="k">Alone, then with a partner</p>
        <p data-quote="README">You work alone on the day. Your partner joins you after the workshop, to attack your app and to test your runbook.</p>
      </div>
    </div>
  </div>
  <aside class="speaker">One line on the method: the AI types; people and checks decide. Nobody is expected to write code. Catches: don't hunt for them, and don't invent them. Follow what really happens, and Log it drafts the lines for you. Falling behind is expected on a day like this: a checkpoint is the normal fix, not a failure, and it keeps you learning the method.</aside>
</section>

<!-- 4 Three ways to use Claude · 0:10–0:15 -->
<section class="slide slide--light" data-chrome="light">
  <div class="head">
    <p class="eyebrow">Three ways to use Claude</p>

<!-- 5 The terminal, Mac and Windows -->
<section class="slide slide--dark" data-chrome="dark">
  <div class="head">
    <p class="eyebrow">The terminal</p>
    <h2>Type a command, press Enter, read what it prints</h2>
  </div>
  <div class="body">
    <table class="keys">
      <thead><tr><th></th><th>Mac · Terminal</th><th>Windows · Git Bash (being tested)</th></tr></thead>
      <tbody>
        <tr><td>Open it</td><td><kbd>Cmd+Space</kbd>, type <code>Terminal</code>, press <kbd>Enter</kbd></td><td>Press the <kbd>Windows</kbd> key, type <code>Terminal</code>, press <kbd>Enter</kbd> (after setting Git Bash as Windows Terminal's default profile)</td></tr>
        <tr><td>Paste a command</td><td><kbd>Cmd+V</kbd></td><td><kbd>Ctrl+V</kbd></td></tr>
        <tr><td>A second one</td><td><kbd>Cmd+N</kbd>: a second window</td><td><kbd>Ctrl+Shift+T</kbd>: a new tab</td></tr>
      </tbody>
    </table>
    <div class="cols cols-2 stretch">
      <div class="card">
        <p class="k">Why two</p>
        <p data-quote="README">While Claude runs in a Terminal window, that window is Claude's.</p>
        <p>Your own commands go in the second one.</p>
      </div>
      <div class="card">
        <p class="k">Windows: being tested</p>
        <p>The guide says Windows (WSL) by arrangement, for now. Git Bash, shown here, is being tested. Check with your instructor before Module 0.</p>
      </div>
    </div>
  </div>
  <aside class="speaker">A terminal is a window where you type a command and the computer prints an answer. The line where you type is the prompt: it ends in % on a Mac and $ in Git Bash. You can't click to move the cursor in it; use the arrow keys. On Windows the lab plans to use Git Bash, which comes with Git for Windows, opened in Windows Terminal. Ctrl+V to paste and Ctrl+Shift+T for a new tab are Windows Terminal's documented keys. Not yet tested on Windows for this lab: that Windows Terminal opens Git Bash once it's set as the default profile, the Windows install steps, and Claude Code's keys there. Say so plainly if anything on the Windows screen differs. Why two: while Claude runs, its window is Claude's, so your own commands go in the second one.</aside>
</section>

  <aside class="speaker">Both presenters share screens, Mac and Windows, each in a throwaway practice folder (mkdir practice, then cd practice), on an account without the lab settings, so Claude asks the way it does out of the box. Before step 2, say: "I've set this machine up so the next command fails, to show you what it looks like." When it fails, say in plain words: "command not found means this computer doesn't have that tool yet. It's nothing you did wrong. Module 0 step 4 installs it. If it still says this just after installing, the 🛟 box under that step says to open a new terminal window and check again." Show that box in the guide. At the prompt, read the command out loud. Choose No first and ask Claude what it was for: not sure? No, then ask. Then ask again, and choose Yes. Point at the line starting with ⏺, the command, and the lines under it starting with ⎿, its output: that's what you trust, not Claude's summary. On the Windows screen, say which steps looked different. The Windows path is still being tested, so say so if anything differs from the slide.</aside>

<!-- 11 The words · 0:40–0:44 -->
<section class="slide slide--light" data-chrome="light">
  <div class="head">
    <p class="eyebrow">Words you'll meet</p>
    <h2>Eight words, and what they mean in this lab</h2>
  </div>
  <div class="body">
    <ul class="words" data-words>
      <li><strong>Repo:</strong> a folder whose history git keeps. Your app's repo is <code>~/projects/hr-case-router/app</code>.</li>
      <li><strong>Commit:</strong> one saved snapshot in a repo's history.</li>
      <li><strong>Branch:</strong> a separate line of commits. <code>main</code> changes only through pull requests.</li>
      <li><strong>Pull request:</strong> a request on GitHub to merge a branch into <code>main</code>. It's reviewed first.</li>
      <li><strong>Story:</strong> one small piece of work, filed as a GitHub issue.</li>
      <li><strong>Gate:</strong> a milestone that stories hold up: MERGE, INSTALL, DEMO, HANDOFF.</li>
      <li><strong>Design term:</strong> one numbered rule in your design record, such as <code>C3</code>. Every test names the term it proves.</li>
      <li><strong>Catch:</strong> a real problem the process found <strong>and that got fixed</strong>, or that changed a decision. A check firing on something you planted to test it isn't a catch.</li>
    </ul>
    <p class="small" data-quote="README">Claude writes the code and runs git; you read and decide.</p>
  </div>
  <aside class="speaker">You'll meet these words; nobody needs to know them today. One picture for the first four: your app's repo is a folder on your computer, and git keeps its history. Each commit is a snapshot in that history. Claude works on a branch, then opens a pull request, and the branch joins main only once the pull request is reviewed. Story, gate and design term arrive in Modules 4 to 6, and each module explains them when they do.</aside>
</section>

<script>
(function(){
  var stage=document.getElementById('stage');
  var deck=document.createElement('div');deck.className='deck';
  var tpl=document.getElementById('slides');
  deck.appendChild(tpl.content.cloneNode(true));
  var chrome=document.getElementById('chrome'),progress=document.getElementById('progress'),help=document.getElementById('help'),notes=document.getElementById('notes'),notesBody=document.getElementById('notesBody'),counter=document.getElementById('counter'),status=document.getElementById('status');
  deck.appendChild(chrome);deck.appendChild(progress);deck.appendChild(help);deck.appendChild(notes);
  stage.appendChild(deck);

  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var n=slides.length,i=0,notesOpen=false;
  var narrow=window.matchMedia('(max-width:760px)');
  function fromHash(){var m=location.hash.match(/#\/?(\d+)/);if(m){var k=parseInt(m[1],10)-1;if(k>=0&&k<n)return k;}return 0;}
  function show(k){
    i=Math.max(0,Math.min(n-1,k));
    slides.forEach(function(s,j){s.classList.toggle('is-active',j===i);});
    var light=slides[i].dataset.chrome==='light';
    chrome.classList.toggle('on-light',light);help.classList.toggle('on-light',light);
    counter.textContent=(i+1)+' / '+n;
    progress.style.width=((i+1)/n*100)+'%';
    var a=slides[i].querySelector('aside.speaker');
    notesBody.textContent=a?a.textContent:'';
    var h=slides[i].querySelector('h1,h2');
    status.textContent='Slide '+(i+1)+' of '+n+': '+(h?h.textContent.replace(/\s+/g,' ').trim():'');
    try{history.replaceState(null,'','#/'+(i+1));}catch(e){}
  }
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||narrow.matches)return;
    switch(e.key){
      case 'ArrowRight':case 'ArrowDown':case ' ':case 'PageDown':e.preventDefault();show(i+1);break;
      case 'ArrowLeft':case 'ArrowUp':case 'PageUp':e.preventDefault();show(i-1);break;
      case 'Home':e.preventDefault();show(0);break;
      case 'End':e.preventDefault();show(n-1);break;
      case 'n':case 'N':notesOpen=!notesOpen;notes.classList.toggle('is-open',notesOpen);break;
      case 'p':case 'P':window.print();break;
    }
  });
  deck.addEventListener('click',function(e){
    if(narrow.matches||e.target.closest('a,button,.notes'))return;
    var r=deck.getBoundingClientRect();
    show(e.clientX-r.left<r.width*0.25?i-1:i+1);
  });
  window.addEventListener('hashchange',function(){show(fromHash());});
  show(fromHash());
})();
</script>
