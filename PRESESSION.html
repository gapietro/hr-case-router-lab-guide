/* One fixed look by design, the participant guide's (build-html.py, the AI Foundry look): Infinite Blue navy for dark
   slides, cool paper for light ones, Wasabi green as the accent (a fill and an edge, and text on navy; on paper, text
   accents are its dark green), amber for what the lab author still has to fill in. Painted explicitly, so it reads
   the same on any host theme. Keep these colours the guide's: python3 deck-look.py --check (#278).
   Fonts: ServiceNow Sans, the brand font, built in above by deck-look.py, so the deck opens offline. The brand's Mono
   is for all-caps labels only (--eyebrow); code stays in each system's monospace.
   Slide engine from the retros repo's decks (principles-deck.html). */
:root{
  color-scheme:light;
  --ink:#032D42;        /* dark slides, headings on light */
  --ink-2:#0A3A52;      /* dark gradient end */
  --paper:#EEF2F4;      /* light slides */
  --card:#FFFFFF;
  --line:#D7E0E4;
  --text:#12222B;       /* body text on light */
  --muted:#4F6670;
  --accent:#63DF4E;     /* Wasabi green: fills and edges, and text on dark */
  --accent-text:#1A6B35;/* green text on light */
  --blue:#7CC4F2;       /* blueprint blue on dark */
  --blue-text:#0A4A68;  /* blueprint blue on light */
  --warn:#D9A21B;       /* amber edge: still to fill in */
  --warn-bg:#FFF7E3;
  --on-dark:#FFFFFF;
  --on-dark-muted:#C9DAE2;
  --display:'ServiceNow Sans Display','ServiceNow Sans','Arial Nova',Arial,system-ui,sans-serif;
  --sans:'ServiceNow Sans','Arial Nova',Arial,system-ui,sans-serif;
  --eyebrow:'ServiceNow Sans Mono',ui-monospace,Consolas,monospace;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  --u:1cqw;             /* type unit: tracks deck width; fixed px on narrow screens */
}
html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--on-dark);font-family:var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
body{overflow:hidden}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Stage: 16:9 letterboxed */
.stage{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink)}
.deck{width:min(100vw,177.78vh);height:min(56.25vw,100vh);position:relative;container-type:inline-size;overflow:hidden;background:var(--ink)}
.slide{position:absolute;inset:0;padding:5.5cqh 6.5cqw 7cqh;display:none;flex-direction:column;gap:calc(var(--u)*1.6)}
.slide.is-active{display:flex}
.slide--dark{background:radial-gradient(46cqw 26cqw at 100% 0%,rgba(99,223,78,.2),transparent 70%),linear-gradient(140deg,var(--ink),var(--ink-2));color:var(--on-dark)}
.slide--light{background:var(--paper);color:var(--text)}
.slide--light h1,.slide--light h2{color:var(--ink)}

/* Type: sized to read on a shared screen */
.eyebrow{font-family:var(--eyebrow);font-size:calc(var(--u)*1.05);letter-spacing:.12em;text-transform:uppercase;margin:0}
.slide--dark .eyebrow{color:var(--accent)}
.slide--light .eyebrow{color:var(--accent-text)}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:calc(var(--u)*5)}
h2{font-size:calc(var(--u)*3)}
.hl{color:var(--accent)}
.slide--light .hl{color:var(--accent-text)}
.sub{font-family:var(--sans);font-weight:400;font-size:calc(var(--u)*1.75);line-height:1.35;margin:0;max-width:62ch;text-wrap:balance}
p,li{font-size:calc(var(--u)*1.5);line-height:1.45;font-weight:400;margin:0}
.slide--dark p,.slide--dark li{color:var(--on-dark)}
strong{font-weight:700}
ul,ol{margin:0;padding-left:calc(var(--u)*1.6);display:flex;flex-direction:column;gap:calc(var(--u)*.6)}
.small{font-size:calc(var(--u)*1.2);opacity:.85}
code,kbd{font-family:var(--mono);font-size:.9em}
.slide--dark code,.slide--dark kbd{color:var(--blue)}
.slide--light code,.slide--light kbd{color:var(--blue-text)}
kbd{font-weight:500}

/* Layout */
.head{display:flex;flex-direction:column;gap:calc(var(--u)*.8)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.3)}
.cols{display:grid;gap:calc(var(--u)*1.6);align-items:start}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:1fr 1fr 1fr}
.cols-32{grid-template-columns:3fr 2fr}
.cols-23{grid-template-columns:2fr 3fr}
.stretch{align-items:stretch}
.col{display:flex;flex-direction:column;gap:calc(var(--u)*1.2)}

/* Cards */
.card{border-radius:10px;padding:calc(var(--u)*1.2) calc(var(--u)*1.4);display:flex;flex-direction:column;gap:calc(var(--u)*.5)}
.slide--light .card{background:var(--card);border:1px solid var(--line)}
.slide--dark .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.card p,.card li{font-size:calc(var(--u)*1.4)}
.k{font-family:var(--eyebrow);font-size:calc(var(--u)*1.05);letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.slide--light .k{color:var(--accent-text)}
.slide--dark .k{color:var(--accent)}
.card--accent{border-color:var(--accent)!important;border-width:2px!important}

/* Tables */
table{border-collapse:collapse;width:100%;font-size:calc(var(--u)*1.4);line-height:1.38}
th,td{text-align:left;padding:calc(var(--u)*.55) calc(var(--u)*.6);vertical-align:top}
thead th{font-family:var(--eyebrow);font-size:calc(var(--u)*.85);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.slide--light td,.slide--light th{border-bottom:1px solid var(--line);color:var(--text)}
.slide--light thead th{color:var(--muted)}
.slide--dark td,.slide--dark th{border-bottom:1px solid rgba(255,255,255,.14);color:var(--on-dark)}
tbody th{font-weight:700}
td code{font-size:calc(var(--u)*1)}
table.day{font-size:calc(var(--u)*1.2)}
table.day td:first-child{font-family:var(--mono);font-size:.88em;white-space:nowrap}
table.perm{font-size:calc(var(--u)*1.2)}
table.perm td:nth-child(2){font-weight:700;width:22%}
table.keys td:first-child{font-weight:700;width:24%}

<!-- ===================== SLIDES (source) ===================== -->
<template id="slides">

<!-- This deck is a participant handout: it ships in the participant pack, and N shows the presenter
     notes to anyone. Write every note as if the room can read it. Slides 2 to 5, the why, are the lab
     author's own argument. Every other fact on a slide is in the README, the pre-work or a module, and data-* quotes
     stay word for word. No slide or note may hint at what a module is there to catch. Check with: python3 tests/check-presession.py
     Placeholders the lab author fills before the session are spans marked data-todo: replace the
     whole span, tags included, with a link, such as <a href="https://example.com/guide">the guide</a>.
     The pack refuses any span left. -->

<!-- 1 Title -->
<section class="slide slide--dark" data-chrome="dark">
  <div class="head"><p class="eyebrow">Agentic Build Lab · Pre-session · 60 minutes</p></div>
  <div class="body" style="justify-content:center">
    <h1>The speed of AI.<br><span class="hl">The quality of a senior developer.</span></h1>
    <p class="sub">That's the goal of this method. This session walks us through the process of building responsibly with AI, and prepares us for the upcoming lab.</p>
    <div class="cols cols-2 stretch">
      <div class="card">
        <p class="k">The next hour</p>
        <p><strong>In the first half,</strong> we cover the why, the what and the how of building this way.</p>
        <p><strong>In the second half,</strong> we get practical: setting up for the lab, and getting the pre-work done.</p>
      </div>
      <div class="card">
        <p class="k">Questions</p>
        <p>Put them in the Teams chat at any time, or speak up and interrupt us.</p>
        <p>This session is for you. If something isn't clear, say so: understanding it matters more than getting through the slides.</p>
      </div>
    </div>
  </div>
  <aside class="speaker">Start the recording, with captions on. Welcome. One line holds this session, and the lab: the speed of AI, with the quality of a senior developer. AI gives us the speed on its own. The quality comes from how we work with it, and that's what the lab teaches. The first half of this hour is the why, the what and the how. The second half is practical: the terminal, the rules and the pre-work, so nobody meets them for the first time at 09:00 on the day. Say this at the start, and mean it: interrupt us at any time. This session is for you, so there's no point in staying quiet when something isn't clear. Understanding is the part that matters most. The Teams chat works too. After each part, pause for 30 seconds: "Anything unclear so far?" Invite questions, but never call on anyone or ask for hands.</aside>
</section>

<!-- 2 Why: the problem -->
<section class="slide slide--light" data-chrome="light">
  <div class="head">
    <p class="eyebrow">Why · The problem</p>
    <h2>AI gives us the speed. <span class="hl">The quality isn't guaranteed.</span></h2>
  </div>
  <div class="body">
    <div class="cols cols-3 stretch">
      <div class="card">
        <p class="k">Fast, and often better</p>
        <p>AI can write code far faster than a person can, and in most cases better.</p>
        <p>Agentic coding tends to go wrong somewhere else: when the AI makes its own decisions, with no input from a person.</p>
      </div>
      <div class="card">
        <p class="k">A likely answer</p>
        <p>When an AI decides for itself, it picks a likely answer. A likely answer can be wrong and still sound right.</p>
        <p data-quote="README">Claude's summary is its best guess, and it can be wrong.</p>
        <p>That's why a person stays in the loop: to decide, and to check.</p>
      </div>
      <div class="card card--accent">
        <p class="k">It runs in production</p>
        <p>In real work, what we build ends up running on a production instance.</p>
        <p>So we have to understand how the code works, and the logic behind it. That's how we keep problems off a live system.</p>
      </div>
    </div>
    <p class="say">The question isn't whether AI can build it. It's whether we can trust what it built.</p>
  </div>
  <aside class="speaker">Start with the problem. AI writes code far faster than a person can, and in most cases better. But writing the code was never the hard part of a ServiceNow build: the decisions are. Left to make them on its own, with no input from a person, an AI picks a likely answer and keeps going. That's where agentic coding goes wrong. A likely answer can be wrong and still sound right. It will tell us the work is done, and it isn't lying: it's guessing. So a person stays in the loop, to decide and to check. On ServiceNow that matters more than in most places, because what we build acts on real records. In the lab we each use our own instance, never production. In real work this code runs in production, so the people responsible for it have to understand how it works, and the logic behind it. If nobody does, nobody can say what it will do to a live system. So the question for this hour isn't whether AI can build the app. It's whether we can trust what it built, and how we'd know.</aside>
</section>

<!-- 3 Why: the standard -->
<section class="slide slide--dark" data-chrome="dark">
  <div class="head">
    <p class="eyebrow">Why · The standard</p>
    <h2>Senior quality comes from six habits, <span class="hl">not from writing the code.</span></h2>
  </div>
  <div class="body">
    <table class="ideas">
      <thead><tr><th style="width:27%">The habit</th><th>What it means</th><th style="width:31%">Where we'll see it on the day</th></tr></thead>
      <tbody>
        <tr><td>A person decides at each milestone</td><td>A person decides whether the work may go further.</td><td>MERGE, INSTALL, DEMO, HANDOFF</td></tr>
        <tr><td>A design agreed first</td><td>What will be built, how and why, agreed and understood before any code.</td><td>The design record, from Module 4</td></tr>
        <tr><td>A check that can fail</td><td>It must pass before work moves on, and it runs the same way every time.</td><td>The guard on every commit, the tests on every story</td></tr>
        <tr><td>Evidence, not someone's word</td><td>Evidence is something anyone can look at or run again. A claim is someone's word.</td><td>A command's output, not Claude's summary of it</td></tr>
        <tr><td>A written record</td><td>Plans, decisions and progress live in files, not in someone's head.</td><td><code>catches.md</code>, the backlog, the session note</td></tr>
        <tr><td>An AI's answer, treated as a draft</td><td>An AI gives a likely answer, not a certain one. It's a draft until a check passes.</td><td>Claude itself: a likely answer, until a check says otherwise</td></tr>
      </tbody>
    </table>
    <p>None of this is new: it's what good dev teams already do. An AI won't keep these habits on its own, so the process makes each one a step.</p>
  </div>
  <aside class="speaker">The last slide left a question: can we trust what the AI built? So ask what makes a senior developer's work trusted. It isn't writing the code: AI does that faster, and often better. It's these six habits, and each one is about deciding, understanding or checking. The first two keep a person in the loop: a person decides, and the design is agreed and understood before any code. If we keep two more, we keep the check and the evidence: a check only counts if it could have failed, and evidence is something we can run again ourselves, not someone's word, Claude's included. An AI won't keep these habits on its own. The process has to give them to it, and that's the next slide.</aside>
</section>

<!-- 4 Why: the method -->
<section class="slide slide--light" data-chrome="light">
  <div class="head">
    <p class="eyebrow">Why · The method</p>
    <h2>The AI assists. <span class="hl">Engineers make the final call.</span></h2>
  </div>
  <div class="body">
    <div class="cols cols-23 stretch">
      <div class="card card--accent">
        <p class="k">People stay in the loop</p>
        <p>AI helps with every part: the app's requirements, its design and architecture, and the key decisions before it reaches an instance.</p>
        <p>An engineer makes the final call on each. So we read what the AI produces, question it, and decide.</p>
        <p>We approve the design before any code is written, so we know how the app works, and why.</p>
      </div>
      <div class="card">
        <p class="k">The six habits, as steps nobody can skip</p>
        <ul>
          <li><strong>A person decides at every milestone.</strong> An instance changes only when its owner says so.</li>
          <li><strong>The design is agreed before anything is built.</strong> Then it's split into small stories, so a wrong turn costs one story.</li>
          <li><strong>We write the test before the code, and watch it fail.</strong> That proves the test can catch a mistake, so the AI can't pass it with code that only looks finished. This is test-driven development.</li>
          <li><strong>We read what a command printed,</strong> not a summary of it.</li>
          <li><strong>Decisions and progress go in files as we go,</strong> so anyone can pick the work up.</li>
          <li><strong>The builder doesn't grade the build.</strong> Someone else reviews it, and that goes for Claude too.</li>
        </ul>
      </div>
    </div>
  </div>
  <aside class="speaker">This is the method in one line: the AI assists; engineers make the final call. This isn't engineers doing the thinking by hand while AI only writes the code. AI helps with every part: it drafts the requirements, advises on the design, and questions it. But an engineer makes the final call on each: the requirements, the design and architecture, and the key decisions before the app reaches an instance. So we read what the AI produces, question it, and decide. Then the AI does the typing, and it's very good at it. On the right are the last slide's six habits, in the same order, each one now a step in the process, so none depends on anyone remembering. Take the tests. Writing a test before the code sounds backwards, and that's the usual first reaction. But if the AI writes the code and then its tests, the tests pass because they were written to pass. Written first, a test has to fail, because the code isn't there yet. Seeing it fail proves it can catch a mistake. The name for this is test-driven development. And we approve the design before any code is written, so we know how the app works, and why: that's what lets us put it on a live system. Nobody is expected to write code on the day.</aside>
</section>

<!-- 5 Why: what we get -->
<section class="slide slide--dark" data-chrome="dark">
  <div class="head">
    <p class="eyebrow">Why · What we get</p>
    <h2>AI's speed, a senior developer's quality, <span class="hl">whoever is prompting.</span></h2>
  </div>
  <div class="body">
    <div class="cols cols-3 stretch">
      <div class="card">
        <p class="k">The speed, kept</p>
        <p>The AI writes fast, and less gets rebuilt.</p>
        <p>A gap found in the design costs a sentence to fix. Found in code, it costs a rebuild.</p>
      </div>
      <div class="card">
        <p class="k">Consistent quality</p>
        <p>The result rests on the process, not on who was prompting that day.</p>
      </div>
      <div class="card">
        <p class="k">Ready for production</p>
        <p>We know how the app works, and why, before it reaches a live system.</p>
      </div>
      <div class="card">
        <p class="k">A trail anyone can follow</p>
        <p>The design, the decisions and the grade live in files. The people who asked for the app can read them, and another team can pick the work up.</p>
      </div>
      <div class="card">
        <p class="k">Our job changes</p>
        <p>AI helps us with every part, and writes the code. We read, question and make the final call.</p>
      </div>
      <div class="card card--accent">
        <p class="k">See for ourselves</p>
        <p>On the day, a grade judges each build the way a demanding senior engineer would. Then we count what the process caught.</p>
      </div>
    </div>
    <p class="say">This is how the AI Foundry builds with AI. The lab is that method, in one day.</p>
  </div>
  <aside class="speaker">This is what we get, and why the AI Foundry builds this way. We keep the AI's speed. That sounds wrong at first, with a morning of reading before any code, but the time goes where mistakes are cheap, so less gets rebuilt later. The quality is consistent: the result rests on the process, so it doesn't depend on who was prompting that day. The app is ready for production, because we approved its design and know how it works, and why. And there's a trail: a design a person signed, the decisions made along the way, and a grade, all in files that the people who asked for the app can read, and another team can pick up. Our job changes too. AI helps us with every part, and we read, question and make the final call: those are the skills the lab practises. Don't take our word for any of it. On the day a grade judges each build, the way a demanding senior engineer would, and then we count what the process caught. The guide says it well: the count makes the case for working this way, or against it. Opinion doesn't.</aside>
</section>

<!-- 6 What: the five stages -->
<section class="slide slide--light" data-chrome="light">
  <div class="head">
    <p class="eyebrow">What · The method's five stages</p>
    <h2>Five stages. Each ends with an engineer's decision, written down.</h2>
  </div>
  <div class="body">
    <table class="process" data-stages>
      <thead><tr><th style="width:15%">Stage · click one</th><th style="width:17%">On the day</th><th>What we do</th><th style="width:24%">The habit at work</th></tr></thead>
      <tbody>
        <tr><td><button type="button" class="more" data-more="consult">1 · Consult</button></td><td>Modules 1 and 2</td><td>We settle what the app must do, and how each part should be built. AI drafts and advises; we question it.</td><td>An AI's answer, treated as a draft</td></tr>
        <tr><td><button type="button" class="more" data-more="design">2 · Design</button></td><td>Modules 3 to 5</td><td>We check the facts on our own instance, agree the design, and split it into small stories. Nothing is built yet.</td><td>A design agreed first</td></tr>
        <tr><td><button type="button" class="more" data-more="build">3 · Build</button></td><td>Module 6</td><td>The AI writes the code, one story at a time. Each test is written first, and a review follows.</td><td>A check that can fail</td></tr>
        <tr><td><button type="button" class="more" data-more="review">4 · Quality review</button></td><td>Module 7, and after the workshop</td><td>Someone who didn't build it grades it, then tries to break it.</td><td>Evidence, not someone's word</td></tr>
        <tr><td>5 · Handover</td><td>After the workshop</td><td>We write down how to run the app, and test that another team could.</td><td>A written record</td></tr>
      </tbody>
    </table>
    <p><strong>The sixth habit runs through all five:</strong> a person decides at each milestone.</p>
    <p><strong>Module 8 closes the day:</strong> we count the mistakes each stage stopped, to see what working this way was worth.</p>
  </div>
  <aside class="speaker">That was the why. Now the what. This is the method the AI Foundry uses on real builds, squeezed into one day. The six habits from the last slides are built into five stages, and the last column says which habit each stage puts to work. Five stages, five habits. The sixth runs through all of them: AI helps in every stage, and each ends with an engineer's decision, written down. Each underlined stage name is a button: click one and a panel shows that stage's modules, with what happens in real work, why it matters and the mindset to bring. Esc closes it. Open one when someone asks, and skip it otherwise. That's the final call, made five times, and each time it goes into a document: the requirements, the design, the plan, the grade, the runbook. Whoever picks the work up next can read what was decided, and why. The earlier the stage, the cheaper its catch: that's why the day starts with reading, not code. Stages 1 and 2 fill the morning. Stage 3 is the build. Stage 4 starts on the day with the grade, and finishes after the workshop, with stage 5.</aside>
</section>

<!-- 7 What: the day -->
<section class="slide slide--light" data-chrome="light">
  <div class="head">
    <p class="eyebrow">What · The day</p>
    <h2>Eight modules on the day. Each one leaves us with something.</h2>
  </div>
  <div class="body">
    <div class="cols cols-2 day-split">
      <div class="col">
      <p class="k">Morning · Stages 1 and 2 · We decide</p>
      <table class="day" data-day>
        <thead><tr><th style="width:27%">When</th><th style="width:33%">Module</th><th>Result</th></tr></thead>
        <tbody>
          <tr><td>08:50 · 10 min</td><td>Kickoff</td><td>The customer, the use case, and how the day runs</td></tr>
          <tr><td>09:00 · 40 min</td><td>1 · Inputs to PRD</td><td>An accepted product requirements document (PRD)</td></tr>
          <tr><td>09:40 · 30 min</td><td>2 · Consult</td><td><code>CONSULT.md</code>: what to build, and how</td></tr>
          <tr><td>10:10 · 75 min</td><td>3 · Research and LLD</td><td>A low-level design (LLD)</td></tr>
          <tr><td>11:25 · 10 min</td><td>Break</td><td></td></tr>
          <tr><td>11:35 · 55 min</td><td>4 · Design challenge</td><td>A design record</td></tr>
          <tr><td>12:30 · 25 min</td><td>5 · Check and plan</td><td>A plan on GitHub</td></tr>
        </tbody>
      </table>
      </div>
      <div class="col">
      <p class="k">Afternoon · Stages 3 and 4 · We build</p>
      <table class="day" data-day>
        <thead><tr><th style="width:27%">When</th><th style="width:33%">Module</th><th>Result</th></tr></thead>
        <tbody>
          <tr><td>12:55 · 30 min</td><td>6 · Build loop</td><td>Your first story, merged</td></tr>
          <tr><td>13:25 · lunch</td><td>6, continued</td><td>Claude builds the next stories while you eat</td></tr>
          <tr><td>14:15 · 60 min</td><td>6, continued</td><td>The app installed, and the AI agent working live</td></tr>
          <tr><td>15:15 · 10 min</td><td>Break</td><td></td></tr>

<section class="slide slide--light" data-chrome="light">

    <h2>The first words we'll meet</h2>
  </div>
  <div class="body">
    <ul class="words" data-words>
      <li><strong>Repo:</strong> a folder with a saved history of its changes. Your app's repo is <code>~/projects/hr-case-router/app</code>.</li>
      <li><strong>Commit:</strong> one saved snapshot in a repo's history.</li>
      <li><strong>Branch:</strong> a separate line of commits in a repo. Work happens on a branch, so <code>main</code> changes only through pull requests.</li>
      <li><strong>Pull request:</strong> a request that asks GitHub to merge a branch into <code>main</code>. It's reviewed before it merges.</li>
      <li><strong>Story:</strong> one small piece of work, tracked as a GitHub issue. An issue is a to-do item on GitHub.</li>
      <li><strong>Gate:</strong> a milestone that waits until its stories are finished. This lab has four gates: MERGE, INSTALL, DEMO and HANDOFF.</li>
      <li><strong>Design term:</strong> one numbered rule in your design record, such as <code>C3</code>. Every test names the design term it proves.</li>
      <li><strong>Catch:</strong> a real problem the process found that was fixed, or that changed a decision. A planted problem isn't a catch just because the check finds it.</li>
    </ul>
    <p class="small">The guide explains more as we go. In the guide, <strong>Notes</strong> › <strong>Show words</strong> lists them all.</p>

<script>
(function(){
  var stage=document.getElementById('stage');
  var deck=document.createElement('div');deck.className='deck';
  var tpl=document.getElementById('slides');
  deck.appendChild(tpl.content.cloneNode(true));
  var chrome=document.getElementById('chrome'),progress=document.getElementById('progress'),help=document.getElementById('help'),notes=document.getElementById('notes'),notesBody=document.getElementById('notesBody'),counter=document.getElementById('counter'),status=document.getElementById('status');
  var more=document.getElementById('more'),moreTitle=document.getElementById('moreTitle'),moreBody=document.getElementById('moreBody'),moreClose=document.getElementById('moreClose'),moreFrom=null;
  deck.appendChild(chrome);deck.appendChild(progress);deck.appendChild(help);deck.appendChild(notes);deck.appendChild(more);
  stage.appendChild(deck);

  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var n=slides.length,i=0,notesOpen=false;
  var narrow=window.matchMedia('(max-width:760px)');
  function fromHash(){var m=location.hash.match(/#\/?(\d+)/);if(m){var k=parseInt(m[1],10)-1;if(k>=0&&k<n)return k;}return 0;}
  // Stage details (#281): a stage button opens its module rows, cloned from the handout slides, in a panel.
  function openMore(b){
    var rows=deck.querySelectorAll('.slide tr[data-stage="'+b.dataset.more+'"]');
    if(!rows.length)return;
    if(narrow.matches){rows[0].closest('.slide').scrollIntoView();return;}
    var t=document.createElement('table'),tb=document.createElement('tbody');
    t.className='how';t.appendChild(rows[0].closest('table').tHead.cloneNode(true));
    Array.prototype.forEach.call(rows,function(r){tb.appendChild(r.cloneNode(true));});
    t.appendChild(tb);
    moreTitle.textContent=b.textContent.replace(/\s+/g,' ').trim();
    moreBody.textContent='';moreBody.appendChild(t);
    more.hidden=false;moreFrom=b;moreClose.focus();
  }
  function closeMore(){
    if(more.hidden)return;
    more.hidden=true;if(moreFrom&&moreFrom.isConnected)moreFrom.focus();moreFrom=null;
  }
  function show(k){
    closeMore();
    i=Math.max(0,Math.min(n-1,k));
    slides.forEach(function(s,j){s.classList.toggle('is-active',j===i);});
    var light=slides[i].dataset.chrome==='light';
    chrome.classList.toggle('on-light',light);help.classList.toggle('on-light',light);
    counter.textContent=(i+1)+' / '+n;
    progress.style.width=((i+1)/n*100)+'%';
    var a=slides[i].querySelector('aside.speaker');
    notesBody.textContent=a?a.textContent:'';
    var h=slides[i].querySelector('h1,h2');

    try{history.replaceState(null,'','#/'+(i+1));}catch(e){}
  }
  document.addEventListener('keydown',function(e){
    if(!more.hidden){
      // The panel is open: Esc closes it, Tab stays on Close, and no key moves the slide.
      if(e.key==='Escape'){e.preventDefault();closeMore();}
      else if(e.key==='Tab'){e.preventDefault();moreClose.focus();}
      return;
    }
    if(e.metaKey||e.ctrlKey||e.altKey||narrow.matches)return;
    // Space or Enter on a button or a link presses it; it doesn't also move the slide.
    if((e.key===' '||e.key==='Enter')&&e.target.closest&&e.target.closest('button,a'))return;
    switch(e.key){

      case 'ArrowLeft':case 'ArrowUp':case 'PageUp':e.preventDefault();show(i-1);break;

      case 'p':case 'P':window.print();break;

    if(e.target===more||e.target.closest('#moreClose')){closeMore();return;}
    if(narrow.matches||e.target.closest('a,button,.notes,.more-panel'))return;
    var r=deck.getBoundingClientRect();

  show(fromHash());
})();
